name = "web-admin-dev"
main = "src/worker.ts"
compatibility_date = "2026-08-21"
# Unified stack with web (React 19, Vite 8, Tailwind 4, Zustand)

[assets]
directory = "./dist/client"
binding = "ASSETS"

# API service binding
[[services]]
binding = "API"
service = "api-dev"

[vars]
ENVIRONMENT = "dev"

# Workers Logs — див. коментар в api-dev/wrangler.toml.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
