<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover — інакше env(safe-area-inset-*) у tokens.css = 0,
         і контент залазить під виріз/індикатор додому на iPhone. -->
    <!-- interactive-widget=resizes-content: на Android клавіатура закривала
         поле вводу, бо розмір сторінки не мінявся (мінявся лише видимий
         прямокутник). iOS і старші браузери цей ключ ігнорують — там клавіатуру
         обробляє сам клієнт або Safari. `user-scalable` НЕ вимкнено: пінч
         лишається доступним. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Панель відкривають із WebView (телефон, Telegram). Його кеш живучіший за
         браузерний, і після деплою там лишався старий екран із старими хешами
         бандла. Ті самі директиви, що у `web-platform-dev/index.html`. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Смуга браузера (і standalone-режим) має той самий колір, що екран:
         без цього темний застосунок відкривався з білою смугою зверху. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f0f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1013" />
    <!-- Safari сам робить із чисел посилання й фарбує їх синім: у тексті
         магазину «ціна 250» ставала дзвінком. -->
    <meta name="format-detection" content="telephone=no" />
    <title>WWWUABOT — адмін-панель</title>
    <!-- SDK Mini App: без нього `window.Telegram.WebApp` не існує, і гейт не
         відрізнить Telegram від браузера. Той самий CSP-виняток, що в
         `web-platform-dev/index.html`. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!-- Гейт «лише Mini App» вставляє `entryGatePlugin()` з
         `@wwwuabot/shared/security/entry-gate-vite`: стилі — в голову, скрипт —
         першим у тіло. Нижче лишається тільки те, що бачить браузер. -->
    <div class="wb-entry-block" role="alert">
      <span class="wb-entry-block-mark" aria-hidden="true">✦</span>
      <p class="wb-entry-block-kicker">WWWUABOT · ADMIN</p>
      <h1 class="wb-entry-block-title">Лише в Telegram</h1>
      <p class="wb-entry-block-text">
        Адмінка відкривається як мінізастосунок: у боті надішліть /admin і натисніть кнопку. У
        браузері доступу немає.
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
