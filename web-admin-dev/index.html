<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover — інакше env(safe-area-inset-*) у tokens.css = 0,
         і контент залазить під виріз/індикатор додому на iPhone. -->
    <!-- interactive-widget=resizes-content: на Android клавіатура закривала
         поле вводу, бо розмір сторінки не мінявся (мінявся лише видимий
         прямокутник). iOS і старші браузери цей ключ ігнорують — там клавіатуру
         обробляє сам клієнт або Safari. `user-scalable` НЕ вимкнено: пінч
         лишається доступним. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Панель відкривають із WebView (телефон, Telegram). Його кеш живучіший за
         браузерний, і після деплою там лишався старий екран із старими хешами
         бандла. Ті самі директиви, що у `web-platform-dev/index.html`. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Смуга браузера (і standalone-режим) має той самий колір, що екран:
         без цього темний застосунок відкривався з білою смугою зверху. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f0f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1013" />
    <!-- Safari сам робить із чисел посилання й фарбує їх синім: у тексті
         магазину «ціна 250» ставала дзвінком. -->
    <meta name="format-detection" content="telephone=no" />
    <title>WWWUABOT — адмін-панель</title>
    <!-- SDK Mini App: без нього `window.Telegram.WebApp` не існує, і гейт не
         відрізнить Telegram від браузера. Той самий CSP-виняток, що в
         `web-platform-dev/index.html`. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Блок «лише в Telegram». Стилі стоять у head, гейт — першим у тілі: до
         першого кадру вже відомо, показувати панель чи блок, і нічого не
         блимає. Мірки ті самі, що в платформі. -->
    <style>
      html[data-web-block] #root {
        display: none;
      }

      .wb-entry-block {
        display: none;
      }

      html[data-web-block] body {
        margin: 0;
        background: #f6f1e7;
        color: #1b2430;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      html[data-web-block] .wb-entry-block {
        display: flex;
        box-sizing: border-box;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 100dvh;
        padding: calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
        text-align: center;
        background: radial-gradient(120% 60% at 50% 0%, #fffdf8 0%, #f6f1e7 60%, #efe6d6 100%);
      }

      .wb-entry-block-mark {
        font-size: 28px;
        line-height: 1;
        color: #a06239;
      }

      .wb-entry-block-kicker {
        margin: 6px 0 0;
        font-size: 11px;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: #9a8a68;
      }

      .wb-entry-block-title {
        margin: 0;
        font-size: clamp(26px, 8vw, 34px);
        font-weight: 700;
        line-height: 1.1;
        color: #171d26;
      }

      .wb-entry-block-text {
        margin: 2px 0 0;
        max-width: 32ch;
        font-size: 15px;
        line-height: 1.5;
        color: #5f6873;
      }
    </style>
  </head>
  <body>
    <!-- Гейт «лише Mini App» — до першого кадру й до бандла. Панель
         малюємо тільки з підписаним initData; у браузері показуємо блок.
         Логіка й тести — packages/shared/src/security/mini-app.ts і
         src/entry-gate.dom.test.ts. -->
    <script id="entry-gate">
      (function () {
        var initData = "";
        try {
          var app = window.Telegram && window.Telegram.WebApp;
          initData = (app && typeof app.initData === "string" && app.initData) || "";
        } catch (e) {}
        var local =
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1" ||
          location.hostname === "[::1]";
        if (!initData && !local) {
          document.documentElement.setAttribute("data-web-block", "");
        }
      })();
    </script>
    <div class="wb-entry-block" role="alert">
      <span class="wb-entry-block-mark" aria-hidden="true">✦</span>
      <p class="wb-entry-block-kicker">WWWUABOT · ADMIN</p>
      <h1 class="wb-entry-block-title">Лише в Telegram</h1>
      <p class="wb-entry-block-text">
        Адмінка відкривається як мінізастосунок: у боті надішліть /admin і натисніть кнопку. У
        браузері доступу немає.
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
