name = "wwwuabot-web-admin"
main = "src/worker.ts"
compatibility_date = "2026-08-21"
# Unified stack with web (React 19, Vite 8, Tailwind 4, Zustand)

[assets]
directory = "./dist/client"
binding = "ASSETS"

# Default D1 binding (for top-level deploy without --env)
[[d1_databases]]
binding = "DB"
database_name = "wwwuabot-db-dev"
database_id = "9fc03f61-d497-4d92-bae4-c92b02c2d1c5"

# Dev середовище (замовчування для wrangler dev)
[env.dev]
name = "wwwuabot-web-admin-dev"

[env.dev.vars]
ENVIRONMENT = "dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "wwwuabot-db-dev"
database_id = "9fc03f61-d497-4d92-bae4-c92b02c2d1c5"

[[env.dev.services]]
binding = "API"
service = "wwwuabot-api-dev"

# Production середовище
[env.production]
name = "wwwuabot-web-admin-prod"

[env.production.vars]
ENVIRONMENT = "prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "wwwuabot-db-prod"
database_id = "6e690692-7671-4598-826c-c2db591399a2"

[[env.production.services]]
binding = "API"
service = "wwwuabot-api-prod"

