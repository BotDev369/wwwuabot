name = "api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-21"

# Sentry SDK для Workers вимагає AsyncLocalStorage, тобто `nodejs_compat`
# і дату сумісності ≥ 2024-09-23. DSN живе не тут, а в Cloudflare Secrets
# (`SENTRY_DSN`) — без нього Sentry просто вимкнено.
compatibility_flags = ["nodejs_compat"]

# Default D1 binding (for local dev without --env)
[[d1_databases]]
binding = "DB"
database_name = "wwwuabot-db-dev"
database_id = "9fc03f61-d497-4d92-bae4-c92b02c2d1c5"

[[kv_namespaces]]
binding = "CONTENT_KV"
id = "bda7a5fca58b4fbda87d75105d558ebf"

# Фото й файли магазину: байти лежать у R2, облік — у рядках `shop_media`, а
# ключ має вигляд `shop/<shop_id>/<випадкове>-ім'я` (docs/SHOPS.md §5).
#
# Бакет — середовища, як і база: дев-воркер дивиться лише в `-dev`. Прод
# отримає свій бакет разом із прод-воркером — прода поки немає (AGENTS.md §1),
# а змішати їх означало б писати прод-фото з дев-коду. Стежить
# `packages/shared/src/config/wrangler-env.test.ts`.
[[r2_buckets]]
binding = "SHOP_MEDIA"
bucket_name = "wwwuabot-shop-dev"

[vars]
# ADMIN_SECRET, BOT_TOKEN, SECRET_TOKEN, SENTRY_DSN, GITHUB_MONITOR_TOKEN і
# CF_MONITOR_TOKEN — задаються через Cloudflare Dashboard (Secrets).
#
# `MONITOR_GITHUB_REPO` — не секрет: це просто адреса репозиторію, з якого
# знімається зріз моніторингу. Токен (`GITHUB_MONITOR_TOKEN`) потрібен лише
# для приватного репозиторію та вищого ліміту запитів: без нього публічний
# репозиторій читається анонімно (60 запитів/год на IP воркера).
MONITOR_GITHUB_REPO = "BotDev369/wwwuabot"
#
# Воркер називається `api-dev`, тому `dev`: у Sentry мітка `environment` має
# відповідати тому, де код насправді працює. Прод — окремий воркер із
# `production`, а не правка цього рядка (`wrangler-env.test.ts` це перевіряє).
ENVIRONMENT = "dev"

# Workers Logs: логи, помилки й необроблені винятки видно в панелі Cloudflare.
# invocation_logs = false — вимикає лише службовий лог кожного запиту
# (найбільший обсяг і найменша користь), а власні console.* та винятки
# лишаються. Саме тому безкоштовного ліміту (200 000 подій/добу, 3 дні)
# вистачає з запасом. Див. docs/CONSOLIDATION_PLAN.md §5.8.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

# Дає SDK `id` версії — у Sentry видно, який саме деплой зламався.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Автоматичний зріз моніторингу раз на добу (04:17 UTC). Той самий рядок
# показує сторінка моніторингу — він лежить у `services/monitoring/collect.ts`
# (`CRON_SCHEDULE`). Збір міряє розмір і рядки коду з архіву гілки та
# показники репозиторію з GitHub API; пропущені зрізи не біда — кожен
# наступний міряє той самий проєкт заново.
[triggers]
crons = ["17 4 * * *"]
