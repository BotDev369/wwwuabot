name = "web-platform-dev"
main = "src/worker.ts"
compatibility_date = "2026-08-21"
# Unified stack with web-admin (React 19, Vite 8, Tailwind 4)
# Deploy: npx wrangler deploy
# All 4 workers use unified CI pipeline

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[[services]]
binding = "API"
service = "api-dev"

[vars]
# Воркер називається `web-platform-dev`, тому `dev` (див. api-dev/wrangler.toml).
# Зараз код це значення не читає — воно тут, щоб середовище було оголошене
# однаково в усіх чотирьох воркерах і це перевіряв `wrangler-env.test.ts`.
ENVIRONMENT = "dev"

# Workers Logs — див. коментар в api-dev/wrangler.toml.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
