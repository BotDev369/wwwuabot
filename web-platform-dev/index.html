<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — інакше env(safe-area-inset-*) у tokens.css = 0,
         і контент залазить під виріз/індикатор дому на iPhone. -->
    <!-- interactive-widget=resizes-content: на Android клавіатура закривала
         смугу вводу, бо розмір сторінки не мінявся (мінявся лише видимий
         прямокутник). iOS і старші браузери цей ключ ігнорують — там клавіатуру
         обробляє сам клієнт або Safari. `user-scalable` НЕ вимкнено: пінч
         лишається доступним. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Смуга браузера (і standalone-режим) має той самий колір, що екран:
         без цього темний застосунок відкривався з білою смугою зверху. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f0f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1013" />
    <!-- Safari сам робить із чисел посилання й фарбує їх синім: у тексті
         магазину «ціна 250» ставала дзвінком. -->
    <meta name="format-detection" content="telephone=no" />
    <title>WWWUABot — Web Platform</title>
    <!-- Критичний шар обкладинки: доки вантажиться бандл і відповідає
         `/api/user/access`, екран уже показує фото й назву. Мірки — ті самі,
         що в `showcase.css`; міняються разом із ним. React замінює цей вміст
         своїм першим рендером. -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #7c4520;
      }

      body {
        color: #ffffff;
        font-family:
          "Onest",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      .wb-showcase {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        background: #3a2320;
      }

      .wb-showcase-hero {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 100dvh;
        min-height: 420px;
        overflow: hidden;
        /* Низ кадру — над текстом: назва не лягає на паляницю (див. showcase.css). */
        --hero-art-bottom: calc(
          clamp(3rem, 15vw, 4.4rem) + 8px + 23px + 12px + 44px + 32px +
            env(safe-area-inset-bottom) + 16px
        );
        background: linear-gradient(
          180deg,
          #a06239 0%,
          #a06239 12%,
          #8b5735 36%,
          #8a4e24 68%,
          #7c4520 90%,
          #7c4520 100%
        );
      }

      .wb-showcase-frame {
        position: absolute;
        bottom: var(--hero-art-bottom);
        left: 50%;
        width: min(100%, calc((100dvh - var(--hero-art-bottom)) * 880 / 1184));
        aspect-ratio: 880 / 1184;
        transform: translateX(-50%);
        -webkit-mask-image: linear-gradient(
          180deg,
          transparent 0%,
          #000 7%,
          #000 93%,
          transparent 100%
        );
        mask-image: linear-gradient(180deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
      }

      .wb-showcase-photo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wb-showcase-brand {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 0 16px calc(32px + env(safe-area-inset-bottom));
        text-align: center;
      }

      .wb-showcase-title {
        margin: 0;
        font-size: clamp(3rem, 15vw, 4.4rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #ffffff;
        text-shadow:
          0 4px 26px rgba(38, 18, 10, 0.75),
          0 1px 2px rgba(38, 18, 10, 0.55);
      }

      .wb-showcase-tagline {
        margin: 8px 0 0;
        font-size: 15px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.94);
        text-shadow: 0 2px 12px rgba(51, 24, 8, 0.5);
      }

      .wb-showcase-cue {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 44px;
        margin-top: 12px;
        color: rgba(255, 255, 255, 0.92);
      }

      .wb-showcase-cue svg {
        display: block;
        width: 34px;
        height: 34px;
        filter: drop-shadow(0 2px 8px rgba(40, 20, 12, 0.45));
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!-- Гейт «лише Mini App» вставляє `entryGatePlugin()` з
         `@wwwuabot/shared/security/entry-gate-vite`: стилі — в голову, скрипт —
         першим у тіло. Нижче лишається тільки те, що бачить браузер. -->
    <div class="wb-entry-block" role="alert">
      <span class="wb-entry-block-mark" aria-hidden="true">✦</span>
      <p class="wb-entry-block-kicker">ПАЛЯНИЦЯ</p>
      <h1 class="wb-entry-block-title">Лише в Telegram</h1>
      <p class="wb-entry-block-text">
        Платформа відкривається як мінізастосунок — з бота. У браузері доступу немає.
      </p>
    </div>
    <div id="root">
      <main class="wb-showcase">
        <section class="wb-showcase-hero">
          <span class="wb-showcase-frame">
            <img
              class="wb-showcase-photo"
              src="/media/home-hero.jpg"
              alt=""
              width="880"
              height="1184"
              fetchpriority="high"
              decoding="async"
            />
          </span>
          <div class="wb-showcase-brand">
            <h1 class="wb-showcase-title">ПАЛЯНИЦЯ</h1>
            <p class="wb-showcase-tagline">платформа для своїх</p>
            <!-- Стрілка — малюнок до першого рендера: кнопкою вона стає
                 разом із застосунком. -->
            <span class="wb-showcase-cue" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 5v14" />
                <path d="M19 12l-7 7-7-7" />
              </svg>
            </span>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
