name = "bot-dev"
main = "src/index.ts"
compatibility_date = "2026-08-21"

# Sentry SDK для Workers вимагає AsyncLocalStorage, тобто `nodejs_compat`
# (див. коментар у api-dev/wrangler.toml).
compatibility_flags = ["nodejs_compat"]

# Default D1 binding (for local dev without --env)
[[d1_databases]]
binding = "DB"
database_name = "wwwuabot-db-dev"
database_id = "9fc03f61-d497-4d92-bae4-c92b02c2d1c5"

[vars]
# Воркер називається `bot-dev`, і тут має стояти `dev` — одне слово на один
# стан. Прод отримає `production` окремим деплоєм (окремий воркер + окрема
# БД), а не правкою цього рядка.
#
# Від значення залежить і текст помилки для користувача (`TEXTS.error`), і
# мітка `environment` у Sentry. Розбіжність не ловить ні typecheck, ні око —
# тому її перевіряє тест `wrangler-env.test.ts`.
ENVIRONMENT = "dev"
CLOUDINARY_CLOUD_NAME = "ddoumoe5n"

[[queues.producers]]
binding = "LOG_QUEUE"
queue = "wwwuabot-logs"

[[queues.consumers]]
queue = "wwwuabot-logs"
max_batch_size = 100
max_batch_timeout = 30

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

# Дає SDK `id` версії — у Sentry видно, який саме деплой зламався.
[version_metadata]
binding = "CF_VERSION_METADATA"
