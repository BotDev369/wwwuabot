# Dependabot: оновлення залежностей.
#
# **Чому тут лише два записи.** Репозиторій — це npm-воркспейси з одним
# `package-lock.json` у корені. Запис із `directory: "/"` працює не лише з
# кореневим манифестом, а й з усіма воркспейсами: він оновлює `api-dev`,
# `bot-dev`, `web-platform-dev`, `web-admin-dev`, `packages/shared` і
# `packages/ui` одним PR (приклад — PR #45 на `wrangler`, який правив чотири
# воркерські манифести).
#
# Доти тут стояли ще чотири записи — `/bot`, `/web`, `/api`, `/web-admin`.
# Таких тек у репозиторії **немає**: воркспейси звучать `*-dev`, і після переходу
# на монорепо ці записи лишились від старої структури. Dependabot недосяжну теку
# просто пропускає, тому шкоди вони не робили — але читались як покриття, якого
# немає: оновлення `wrangler` у воркерах виглядали «не описані ніде», хоч
# насправді ними керує кореневий запис.
#
# Якщо воркспейс колись отримає **власний lockfile** — йому знадобиться окремий
# запис із `directory: "/<тека>"`. Поки локи один, окремі записи дали б дублікати
# PR на ту саму залежність.
#
# **Чому оновлення згруповано.** 13.09.2026 Dependabot відкрив 11 PR поспіль —
# кожен на один пакет. Переглянути такий список із телефона неможливо, а гілки
# швидко відстають від `main` і починають конфліктувати в `package-lock.json`
# (саме так «зависав» PR #42). Тому мінорні й патчові оновлення збираються в
# **один** PR на екосистему.
#
# Що лишається окремо — свідомо:
# - **мажорні** версії (в них ламаючі зміни, рішення мусить бути усвідомленим:
#   `typescript 7` вимагав міграції `tsconfig`, `vitest 5` — виправлення типів);
# - **оновлення безпеки** (`applies-to: version-updates`, а не security-updates):
#   уразливість не має чекати тижневого циклу групи.
#
# Якщо згрупований PR впаде на одному пакеті — розібрати його можна командою
# `@dependabot ungroup` у PR (Dependabot розкладе його назад на окремі гілки).

version: 2
updates:
  # Усі npm-залежності репозиторію (корінь + воркспейси).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Версії GitHub Actions у `.github/workflows/*` — вони старіють так само, як
  # пакети, і застарілий раннер ламає CI без жодної зміни в коді (Node 20 → 24).
  # Мажорні стрибки екшенів теж лишаються окремими: `checkout@v7` змінює
  # поведінку на `pull_request_target`, і це рішення, а не патч.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
