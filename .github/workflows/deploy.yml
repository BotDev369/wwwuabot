name: Deploy

# Два режими однієї пайплайни:
#   • pull_request — тільки гейти (`checks`), деплой неможливий.
#   • push у main / workflow_dispatch — гейти, потім **усі** воркери.
#
# **Усі, а не «змінені».** Фільтр шляхів відповідає на питання «чи змінився
# воркер у ЦЬОМУ пуші», а не «чи відрізняється задеплоєне від `main`». Один
# червоний прогін лишав веб незадеплоєним, наступний пуш по `api-dev` його вже
# не піднімав — і `main` зеленів, поки воркер відставав, а «пропущено» у списку
# джоб виглядає так само, як «нічого не змінилось». Ціна повного деплою —
# паралельні `npm ci` + збірка на кожен пуш; вони дешевші за `checks`, який і
# так стоїть перед ними, і не лишають двох правд між воркерами.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Мінімальні права GITHUB_TOKEN: деплою він не потрібен зовсім, а дефолтний
# токен у багатьох репозиторіях має write-доступ. Менше прав — менше наслідків,
# якщо токен колись потече через дію зі стороннього екшену.
permissions:
  contents: read

# Не давати двом пушам деплоїти одночасно: Cloudflare — last-write-wins, тож
# паралельні деплої можуть відкотити новіший код старішим. Черга (не
# скасування!) гарантує, що останнім на прод потрапляє найновіший коміт.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Єдиний гейт перед деплоєм. Раніше тут не було тестів (S-6) і `npm audit`
  # стояв із `continue-on-error: true`, тобто не блокував нічого. Тепер:
  # вразливість `high` або червоний тест = жоден воркер не поїде на прод.
  # Образ пінимо, а не `ubuntu-latest`: міграція `latest` на новий образ
  # міняє раннер під ногами, і джоба з усіма зеленими кроками впирається в
  # ліміт часу — тоді деплой зривається не через код, а через образ.
  # **Три джоби, а не одна.** Усередині джоби кроки завжди послідовні, а
  # раннерів у CI стільки, скільки джоб: 27.11.2026 єдина `checks` ішла 235 с
  # (run 45927569204), хоч кожна група окремо — близько двох хвилин. Тому
  # робота поділена за ресурсом, а не за темою:
  #
  #   checks-static  — аудит, лінт, типи, формат, девʼять статичних гейтів;
  #   checks-tests   — тести з покриттям і підлога покриття;
  #   checks-browser — обидві збірки, Chromium, перший кадр під CSP, бюджет.
  #
  # Замок `checks` наприкінці збирає їх в одне імʼя, тож `deploy-*`,
  # `scripts/check-deploy.mjs` і звіт деплою про поділ не знають.
  checks-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # Історія цілком — для гейтів, які звіряють стан із комітом у минулому:
          # `fetch-depth: 1` робив би їх червоними не через код.
          fetch-depth: 0
      # Node і залежності — спільна дія: кеш `node_modules` за відбитком lockfile,
      # `npm ci` лише на промаху (чому саме так — `.github/actions/deps/action.yml`).
      - uses: ./.github/actions/deps
      # Поріг піднято з `critical` до `high` 13.09.2026: після оновлення
      # `wrangler`/`miniflare` (sharp) і `vitest` у репозиторії **нуль**
      # уразливостей, а `high` — саме той рівень, який раніше проходив повз гейт.
      # `moderate` лишається попередженням, бо виправити його часто нічим:
      # це транзитивні залежності інструментів розробки.
      # Гейт стоїть на тому, що **їде на прод**. Причина — не «менше перевірок»,
      # а те, що повний аудит 18.11.2026 став незадовільнимим у принципі:
      # `picomatch` (CVE-2026-112366, ReDoS, `high`) має «Patched versions: None»,
      # тобто виправленого релізу не існує, а приходить він лише через
      # інструменти розробки (vite, vitest, tinyglobby, eslint). Гейт, який
      # неможливо зробити зеленим, блокує кожен деплой: саме так прод стояв на
      # `2bd4e88a`, поки `checks` падав на аудиті й деплої не стартували.
      # Тому: уразливість у тому, що віддається користувачу, — червоне;
      # уразливість у dev-інструментах — видимий звіт, а не стоп.
      - name: Security audit (high, shipped deps)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Format check
        run: npx prettier --check .
      # «Клас без правила» не ламає ні збірку, ні тести — він просто нічого не
      # робить. Саме тому 44 класи `wb-block-*`, `.sidebar-theme-btn` і
      # `.site-preview` прожили місяці. Гейт ловить їх статично.
      - name: CSS classes
        run: npm run check:css

      - name: Inline styles (admin)
        run: npm run check:inline
      # Каталог вигляду: перелік токенів і класів для сторінки `/style` в
      # адмінці виводиться з CSS. Застарілий каталог показував би значення,
      # яких на екрані вже немає, — це гірше за відсутність довідника.
      - name: Style catalog
        run: npm run check:style
      # Планка: ліміт рядків файлу, «100vh без dvh-фолбеку», нативні
      # alert/confirm/prompt і емодзі в UI. Усе це — правила, які доти існували
      # лише в тексті: файли по 777 рядків і 🔗 у кнопках ніщо не зупиняло.
      - name: Quality bar
        run: npm run check:quality
      # Документи: довгий документ **неможливо правити** — довгий якір у полотні
      # не зіставляється байт-у-байт, і невдача приходить мовчки (так і сталося
      # з журналом на 1 235 рядків). Крок тримає розмір, мертві посилання й §,
      # на які посилається код.
      - name: Docs
        run: npm run check:docs
      # Схема D1: ім'я таблиці або `CREATE TABLE` поза реєстром не ламає ні
      # збірку, ні тести — так і з'явились дві таблиці сценаріїв із різними
      # схемами й `users`, який не створював ніхто.
      - name: D1 schema
        run: npm run check:db
      - name: Comments
        run: npm run check:comments
      - name: Screen texts
        run: npm run check:texts
      # Реєстр екранів: один рядок на екран. Доти назву, батька й місце в меню
      # тримали п'ять списків, і вони вже розійшлися (`assessments` у журналі без
      # маршруту, `analysis` поза зайнятими адресами).
      - name: Screen registry
        run: npm run check:screens

  checks-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          # Гейт покриття порівнює свій код із комітом `NEW_CODE_SINCE`
          # (`scripts/coverage-baseline.mjs`), тож історія потрібна цілком:
          # на `fetch-depth: 1` він упав би з «коміт не знайдено» на кожному
          # запуску, а не на справді непокритому коді.
          fetch-depth: 0
      - uses: ./.github/actions/deps
      # Прогін із покриттям — найдовший крок гейта, і він не залежить ні від
      # статичних гейтів, ні від збірок: тому в нього своя джоба. Раніше він
      # стояв перед збірками, щоб забутий тест червонів раніше за бюджет
      # бандла; тепер джоби біжать одночасно, і обидві причини видно в одному
      # прогоні.
      - name: Coverage floor
        run: |
          npm run test:coverage
          npm run check:coverage
  checks-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deps
      - name: Build shells (bundle budget needs dist)
        run: |
          npm run build --workspace web-platform-dev
          npm run build --workspace web-admin-dev
      # Chromium ставимо просто перед гейтом, а не після `npm ci`: півхвилини
      # завантаження браузера й системних бібліотек не мають оплачуватись,
      # коли lint чи тести з покриттям уже впали раніше.
      #
      # Кеш привʼязаний до версії `playwright`: ревізію браузера задає саме вона,
      # тож після оновлення пакета ключ інший і застарілий Chromium у гейт не
      # поїде. `install` із наявним браузером нічого не качає: лишається тільки
      # apt-частина `--with-deps`, якої кеш не покриває. Провал кешу деплой не
      # блокує — це оптимізація, а не гейт.
      - name: Playwright version for the browser cache
        id: playwright
        run: |
          version=$(node -e 'console.log(require("playwright/package.json").version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the first-frame gate
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium for the first-frame gate
        run: npx playwright install --with-deps chromium
      - name: First-frame gate (strict CSP)
        run: npm run check:gate
      - name: Bundle budget
        run: npm run check:bundle

  # Звітний аудит інструментів розробки. Без `needs` навмисно: джоба стартує
  # разом із гейтом і не подовжує прогін, а `continue-on-error` робить її
  # звітом, а не гейтом — деплої її не чекають (`needs` у них — лише `checks`).
  # Біжить і на `pull_request`: там деплоїв немає, а звіт потрібен.
  audit-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `--package-lock-only`: аудит читає lockfile, `node_modules` не потрібні —
      # джоба не платить встановлення (саме воно й коштувало 34–51 с в аудиті).
      - name: Security audit (dev tools)
        continue-on-error: true
        run: npm audit --package-lock-only --audit-level=high

  # Замок, а не робота: зелений рівно тоді, коли зелені всі три групи.
  #
  # Імʼя `checks` лишається тим самим навмисно: `deploy-*` чекають на нього,
  # `scripts/check-deploy.mjs` вимагає його успіху, `scripts/ci-triage.mjs`
  # знає його як джобу. Поділ на групи — справа гейтів, а не того, хто їх чекає.
  checks:
    needs: [checks-static, checks-tests, checks-browser]
    # `always()`: без нього GitHub пропустив би джобу, коли група впала, і
    # «skipped» у списку виглядало б як «нічого не сталося» замість червоного.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: All gate groups green
        env:
          STATIC: ${{ needs['checks-static'].result }}
          TESTS: ${{ needs['checks-tests'].result }}
          BROWSER: ${{ needs['checks-browser'].result }}
        run: |
          failed=0
          for group in "static:$STATIC" "tests:$TESTS" "browser:$BROWSER"; do
            name=${group%%:*}
            result=${group#*:}
            if [ "$result" = "success" ]; then
              echo "✓ $name — $result"
            else
              echo "✗ $name — $result"
              failed=1
            fi
          done
          exit $failed

  # Тег — `$GITHUB_SHA`: без нього `wrangler deployments status` показує лише
  # час, і «що зараз живе на воркері» доводиться вгадувати.
  deploy-bot:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deps
      - run: cd bot-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deps
      - run: cd api-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deps
      - run: cd web-platform-dev && npm run build
      - run: cd web-platform-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web-admin:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deps
      - run: cd web-admin-dev && npm run build
      - run: cd web-admin-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Звіт агента про деплой — після всіх воркерів і навіть тоді, коли деплой
  # червоний: саме тоді він і потрібен. Токена бота тут немає, лише
  # `AGENT_REPORT_KEY`, який відкриває один ендпоінт бота з єдиним одержувачем
  # (`ADMIN_TELEGRAM_ID`). Провал звіту не робить деплой червоним.
  report:
    needs: [checks, deploy-bot, deploy-api, deploy-web, deploy-web-admin]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    # `id-token: write` — право попросити OIDC-токен джоби; саме він, а не
    # секрет у репозиторії, доводить воркеру, що звіт прийшов із цього репо.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Два коміти: `git diff --shortstat HEAD~1 HEAD` — обсяг цього деплою.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Send report
        env:
          REPORT_URL: https://bot-dev.diskomate.workers.dev/reports
          PLATFORM_URL: https://web-platform-dev.diskomate.workers.dev
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/deploy-report.mjs
