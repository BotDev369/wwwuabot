name: Deploy

# Два режими однієї пайплайни:
#   • pull_request — тільки гейти (`checks`), деплой неможливий.
#   • push у main / workflow_dispatch — гейти, потім **усі** воркери.
#
# **Усі, а не «змінені».** Фільтр шляхів відповідає на питання «чи змінився
# воркер у ЦЬОМУ пуші», а не «чи відрізняється задеплоєне від `main`». Один
# червоний прогін лишав веб незадеплоєним, наступний пуш по `api-dev` його вже
# не піднімав — і `main` зеленів, поки воркер відставав, а «пропущено» у списку
# джоб виглядає так само, як «нічого не змінилось». Ціна повного деплою —
# паралельні `npm ci` + збірка на кожен пуш; вони дешевші за `checks`, який і
# так стоїть перед ними, і не лишають двох правд між воркерами.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Мінімальні права GITHUB_TOKEN: деплою він не потрібен зовсім, а дефолтний
# токен у багатьох репозиторіях має write-доступ. Менше прав — менше наслідків,
# якщо токен колись потече через дію зі стороннього екшену.
permissions:
  contents: read

# Не давати двом пушам деплоїти одночасно: Cloudflare — last-write-wins, тож
# паралельні деплої можуть відкотити новіший код старішим. Черга (не
# скасування!) гарантує, що останнім на прод потрапляє найновіший коміт.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Єдиний гейт перед деплоєм. Раніше тут не було тестів (S-6) і `npm audit`
  # стояв із `continue-on-error: true`, тобто не блокував нічого. Тепер:
  # вразливість `high` або червоний тест = жоден воркер не поїде на прод.
  # Образ пінимо, а не `ubuntu-latest`: міграція `latest` на новий образ
  # міняє раннер під ногами, і джоба з усіма зеленими кроками впирається в
  # ліміт часу — тоді деплой зривається не через код, а через образ.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Гейт покриття порівнює свій код із комітом `NEW_CODE_SINCE`
          # (`scripts/coverage-baseline.mjs`), тож історія потрібна цілком:
          # на `fetch-depth: 1` він упав би з «коміт не знайдено» на кожному
          # запуску, а не на справді непокритому коді.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `ci`, не `install`: збірка мусить бути відтворюваною з lockfile,
      # інакше патч транзитивної залежності тихо змінює прод.
      - run: npm ci
      # Поріг піднято з `critical` до `high` 13.09.2026: після оновлення
      # `wrangler`/`miniflare` (sharp) і `vitest` у репозиторії **нуль**
      # уразливостей, а `high` — саме той рівень, який раніше проходив повз гейт.
      # `moderate` лишається попередженням, бо виправити його часто нічим:
      # це транзитивні залежності інструментів розробки.
      - name: Security audit (high)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Format check
        run: npx prettier --check .
      # «Клас без правила» не ламає ні збірку, ні тести — він просто нічого не
      # робить. Саме тому 44 класи `wb-block-*`, `.sidebar-theme-btn` і
      # `.site-preview` прожили місяці. Гейт ловить їх статично.
      - name: CSS classes
        run: npm run check:css
      # Планка: ліміт рядків файлу, «100vh без dvh-фолбеку», нативні
      # alert/confirm/prompt і емодзі в UI. Усе це — правила, які доти існували
      # лише в тексті: файли по 777 рядків і 🔗 у кнопках ніщо не зупиняло.
      - name: Quality bar
        run: npm run check:quality
      # Документи: довгий документ **неможливо правити** — довгий якір у полотні
      # не зіставляється байт-у-байт, і невдача приходить мовчки (так і сталося
      # з журналом на 1 235 рядків). Крок тримає розмір, мертві посилання й §,
      # на які посилається код.
      - name: Docs
        run: npm run check:docs
      # Схема D1: ім'я таблиці або `CREATE TABLE` поза реєстром не ламає ні
      # збірку, ні тести — так і з'явились дві таблиці сценаріїв із різними
      # схемами й `users`, який не створював ніхто.
      - name: D1 schema
        run: npm run check:db
      - name: Comments
        run: npm run check:comments
      - name: Build shells (bundle budget needs dist)
        run: |
          npm run build --workspace web-platform-dev
          npm run build --workspace web-admin-dev
      - name: Bundle budget
        run: npm run check:bundle
      - name: Unit tests
        run: npm test
      - name: Coverage floor
        run: |
          npm run test:coverage
          npm run check:coverage

  # Тег — `$GITHUB_SHA`: без нього `wrangler deployments status` показує лише
  # час, і «що зараз живе на воркері» доводиться вгадувати.
  deploy-bot:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd bot-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd api-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd web-platform-dev && npm run build
      - run: cd web-platform-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web-admin:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd web-admin-dev && npm run build
      - run: cd web-admin-dev && npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
